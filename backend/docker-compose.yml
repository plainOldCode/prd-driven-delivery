services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: example-workspace-backend
    restart: unless-stopped
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: example_app
      DB_USERNAME: example
      DB_PASSWORD: example
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
