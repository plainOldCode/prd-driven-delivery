databaseChangeLog:
  - changeSet:
      id: 0001-create-sample-task-table
      author: codex
      changes:
        - createTable:
            tableName: sample_task
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - insert:
            tableName: sample_task
            columns:
              - column:
                  name: title
                  value: Wire backend to frontend
              - column:
                  name: status
                  value: TODO
        - insert:
            tableName: sample_task
            columns:
              - column:
                  name: title
                  value: Add Playwright smoke test
              - column:
                  name: status
                  value: READY
