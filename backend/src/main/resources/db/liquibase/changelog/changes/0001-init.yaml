databaseChangeLog:
  - changeSet:
      id: 0001-create-sample-task-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sample_task
      changes:
        - createTable:
            tableName: sample_task
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 0002-seed-sample-task-table
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sample_task
        - sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM sample_task
      changes:
        - insert:
            tableName: sample_task
            columns:
              - column:
                  name: title
                  value: Wire backend to frontend
              - column:
                  name: status
                  value: TODO
        - insert:
            tableName: sample_task
            columns:
              - column:
                  name: title
                  value: Prepare k3s test namespace
              - column:
                  name: status
                  value: READY
