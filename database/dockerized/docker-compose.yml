services:
  mariadb:
    image: mariadb:11.4
    container_name: example-workspace-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: example_app
      MARIADB_USER: example
      MARIADB_PASSWORD: example
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  mariadb_data:
