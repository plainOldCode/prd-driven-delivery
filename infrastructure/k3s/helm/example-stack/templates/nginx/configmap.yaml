apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "example-stack.fullname" . }}-nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location /api/ {
        proxy_pass http://{{ include "example-stack.fullname" . }}-backend:{{ .Values.backend.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://{{ include "example-stack.fullname" . }}-frontend:{{ .Values.frontend.port }};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
