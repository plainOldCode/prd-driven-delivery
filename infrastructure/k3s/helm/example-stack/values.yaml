imagePullSecrets: []

backend:
  image: ghcr.io/example/example-backend:latest
  port: 8080
  imagePullPolicy: IfNotPresent

frontend:
  image: ghcr.io/example/example-frontend:latest
  port: 80
  imagePullPolicy: IfNotPresent

database:
  image: mariadb:11.4
  port: 3306
  name: example_app
  username: example
  password: example
  rootPassword: root
  imagePullPolicy: IfNotPresent

nginx:
  image: nginx:1.27-alpine
  port: 80
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  host: prd-driven-delivery.local
  pathType: Prefix
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
