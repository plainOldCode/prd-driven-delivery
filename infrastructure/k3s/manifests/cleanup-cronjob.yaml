apiVersion: batch/v1
kind: CronJob
metadata:
  name: example-pr-cleanup
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: bitnami/kubectl:1.31
              command: ["/bin/sh", "-c"]
              args:
                - echo "Delete stale PR namespaces here"
